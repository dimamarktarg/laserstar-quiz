<body>
<main id="app" aria-live="polite"></main>
<script>
const steps = [
  { title: "Ви вже робили лазерну епіляцію раніше?", subtitle: "Зазвичай потрібно від 5 до 7 процедур для видимого ефекту!", options: ["Так, у салоні", "Так робила, але не було результату", "Не робила, але хочу спробувати"] },
  { title: "Який у вас тип шкіри?", subtitle: "Є 6 фототипів, яка у Вас?", options: ["1 фототип — дуже світла шкіра, не засмагає взагалі", "2 фототип — європейський, шкіра може перебувати на сонці без захисту", "3 фототип — європейський смаглявий, добре засмагає", "4 фототип — смаглява шкіра, темні очі, темне волосся", "5 фототип — дуже смаглява шкіра, чорні очі, чорне волосся", "6 фототип — афроамериканський тип"] },
  { title: "Який у вас больовий поріг?", subtitle: "Наші апарати видаляють волосся без болю та неприємних відчуттів", options: ["Не переношу біль зовсім", "Я мало чутлива до болю", "Залежить від зон, якщо потрібно можу потерпіти"] },
  { title: "Що вам важливе при виборі салону?", subtitle: "Можна вибрати кілька варіантів", multiple: true, options: ["Вартість за курс", "Позитивні відгуки та рекомендації", "Наявність мед. освіти та кваліфікації", "Ефективність процедури", "Якісне ліцензійне обладнання"] }
];

const icons = {
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M7.5 8C4 8 4 3 7 3c2.5 0 5 5 5 5s2.5-5 5-5c3 0 3 5-.5 5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>'
};

const state = { screen: -1, answers: {}, name: "", phone: "", submitting: false, done: false, error: "" };
const app = document.querySelector("#app");

function escapeAttr(value) {
  return String(value || "").replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

function formatPhone(value) {
  const digits = String(value || "").replace(/\D/g, "");
  if (digits.startsWith("380")) return `+${digits}`;
  if (digits.startsWith("0")) return `+38${digits}`;
  return `+380${digits}`;
}

function rewardCard(extra = "") {
  return `<div class="reward-card ${extra}"><span class="reward-icon">${icons.gift}</span><strong>Отримати знижку</strong><span class="lock">${icons.lock}</span></div>`;
}

function render() {
  if (state.done) {
    app.innerHTML = `<main class="quiz-shell finish-screen"><div class="success-card"><span class="gift gift-large">${icons.gift}</span><h1>Дякуємо!</h1><p>Наш лікар-косметолог зв’яжеться з вами, щоб узгодити зручний час для запису.</p><div class="reward-card"><span class="reward-icon">${icons.gift}</span><strong>Знижка −35% за вами</strong></div></div></main>`;
    return;
  }
  if (state.screen === -1) {
    app.innerHTML = `<main class="start-screen"><div class="start-overlay"></div><section class="start-content"><h1>Дізнайся який тип<br>лазерної епіляції тобі<br>підходить</h1><p>Відповідай на 4 коротких питання та<br>отримай знижку −35% на лазерну<br>епіляцію</p>${rewardCard()}<button class="primary-button" id="start">Почати</button></section></main>`;
    document.querySelector("#start").addEventListener("click", () => { state.screen = 0; render(); });
    return;
  }
  const progress = Math.min(((state.screen + 1) / 5) * 100, 100);
  if (state.screen < steps.length) renderQuestion(progress); else renderContact(progress);
}

function renderQuestion(progress) {
  const current = steps[state.screen];
  const selected = state.answers[state.screen] || [];
  app.innerHTML = `<main class="quiz-shell"><div class="progress-track" aria-label="Крок ${state.screen + 1} з 5"><span style="width:${progress}%"></span></div><section class="question-screen ${state.screen === 1 ? "compact" : ""}"><button class="back-button" id="back" aria-label="Повернутися назад">${icons.left}</button><div class="question-copy"><h1>${current.title}</h1><p>${current.subtitle}</p></div><div class="options" role="${current.multiple ? "group" : "radiogroup"}">${current.options.map((option, index) => { const active = selected.includes(option); return `<button class="option ${active ? "selected" : ""}" data-index="${index}" role="${current.multiple ? "checkbox" : "radio"}" aria-checked="${active}"><span class="checkmark ${current.multiple ? "square" : ""}">${active ? "✓" : ""}</span><span>${option}</span></button>`; }).join("")}</div><div class="question-footer"><div class="gift">${icons.gift}</div><button class="next-button" id="next" ${selected.length ? "" : "disabled"} aria-label="Наступне питання">${icons.right}</button></div></section></main>`;
  document.querySelector("#back").addEventListener("click", () => { state.screen = Math.max(state.screen - 1, -1); render(); });
  document.querySelectorAll(".option").forEach(button => button.addEventListener("click", () => {
    const option = current.options[Number(button.dataset.index)];
    const active = state.answers[state.screen] || [];
    state.answers[state.screen] = current.multiple ? (active.includes(option) ? active.filter(item => item !== option) : [...active, option]) : [option];
    render();
  }));
  document.querySelector("#next").addEventListener("click", () => { if (selected.length) { state.screen += 1; render(); } });
}

function renderContact(progress) {
  app.innerHTML = `<main class="quiz-shell"><div class="progress-track" aria-label="Крок 5 з 5"><span style="width:${progress}%"></span></div><section class="contact-screen"><button class="back-button" id="back" aria-label="Повернутися назад">${icons.left}</button><div class="contact-copy"><h1>Останній крок</h1><p>Наш лікар-косметолог зв’яжеться з вами для уточнення зручного часу для запису</p></div>${rewardCard("contact-reward")}<form id="lead-form"><label class="sr-only" for="name">Ім’я</label><input id="name" name="name" value="${escapeAttr(state.name)}" placeholder="Ім’я" autocomplete="name" required><div class="phone-row"><span class="country-code">🇺🇦 +380</span><label class="sr-only" for="phone">Телефон</label><input id="phone" name="phone" value="${escapeAttr(state.phone)}" placeholder="XX XXX XXXX*" inputmode="tel" autocomplete="tel" required></div><label class="consent"><input id="consent" type="checkbox" checked><span>Я погоджуюсь з <a href="https://laserstar-quiz.dimamarktarg.chatgpt.site/privacy" target="_blank" rel="noopener noreferrer">політикою конфіденційності</a> та правилами використання *</span></label>${state.error ? `<p class="form-error" role="alert">${state.error}</p>` : ""}<button class="primary-button submit-button" id="submit" type="submit" ${state.submitting ? "disabled" : ""}>${icons.send}<span>${state.submitting ? "Надсилаємо…" : "Готово!"}</span></button></form></section></main>`;
  document.querySelector("#back").addEventListener("click", () => { state.screen = steps.length - 1; render(); });
  document.querySelector("#lead-form").addEventListener("submit", submitLead);
}

async function submitLead(event) {
  event.preventDefault();
  if (state.submitting) return;
  const name = document.querySelector("#name").value.trim();
  const phone = document.querySelector("#phone").value.trim();
  const consent = document.querySelector("#consent").checked;
  state.name = name;
  state.phone = phone;
  if (!name || phone.replace(/\D/g, "").length < 9 || !consent) {
    state.error = !consent ? "Підтвердьте згоду з політикою конфіденційності." : "Вкажіть ім’я та коректний номер телефону.";
    render();
    return;
  }
  state.submitting = true;
  state.error = "";
  render();
  try {
    const payload = {
      "Ім’я": name,
      "Телефон": formatPhone(phone),
      "Робила лазерну епіляцію": (state.answers[0] || []).join(", "),
      "Тип шкіри": (state.answers[1] || []).join(", "),
      "Больовий поріг": (state.answers[2] || []).join(", "),
      "Важливо при виборі салону": (state.answers[3] || []).join(", "),
      _subject: "Нова заявка з квізу LaserStar",
      _template: "table",
      _captcha: "false"
    };
    const response = await fetch("https://formsubmit.co/ajax/dimamarktarg@gmail.com", { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(payload) });
    const result = await response.json().catch(() => null);
    if (!response.ok || result?.success === false || result?.success === "false") throw new Error("submit_failed");
    await fetch("https://laserstar-quiz.dimamarktarg.chatgpt.site/api/telegram", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, phone, laser: (state.answers[0] || []).join(", "), skin: (state.answers[1] || []).join(", "), pain: (state.answers[2] || []).join(", "), salon: (state.answers[3] || []).join(", ") }) }).catch(() => null);
    state.done = true;
  } catch {
    state.error = "Не вдалося надіслати заявку. Перевірте інтернет і спробуйте ще раз.";
  } finally {
    state.submitting = false;
    render();
  }
}

render();

</script>
</body>
</html>
